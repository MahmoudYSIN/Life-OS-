    function LifeOSApp() {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem('LIFE_OS_DATA_ENG_V1');
          return saved ? JSON.parse(saved) : DEFAULT_DATA;
        } catch (e) {
          return DEFAULT_DATA;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('LIFE_OS_DATA_ENG_V1', JSON.stringify(state));
        } catch (e) {
          console.error("Failed to save state to LocalStorage", e);
        }
      }, [state]);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const [showQuickAdd, setShowQuickAdd] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [showBriefingModal, setShowBriefingModal] = useState(false);
      const [briefingText, setBriefingText] = useState('');
      const [briefingLoading, setBriefingLoading] = useState(false);

      // Calendar Exporters
      const downloadAppleIcs = (title, description, dateStr, amount) => {
        const dateObj = dateStr ? new Date(dateStr) : new Date();
        const formattedDate = dateObj.toISOString().replace(/-|:|\.\d+/g, '').slice(0, 8);
        const icsData = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//LifeOS//NONSGML Calendar Event//EN',
          'BEGIN:VEVENT',
          `SUMMARY:${title} ${amount ? `($${amount})` : ''}`,
          `DESCRIPTION:${description || 'Reminder from Life Operating System'}`,
          `DTSTART:${formattedDate}T090000Z`,
          `DTEND:${formattedDate}T100000Z`,
          'STATUS:CONFIRMED',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${title.replace(/\s+/g, '_')}.ics`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Apple Calendar (.ics) file downloaded!');
      };

      const openGoogleCalendar = (title, description, dateStr) => {
        const dateObj = dateStr ? new Date(dateStr) : new Date();
        const formattedDate = dateObj.toISOString().replace(/-|:|\.\d+/g, '').slice(0, 8);
        const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&details=${encodeURIComponent(description || '')}&dates=${formattedDate}T090000Z/${formattedDate}T100000Z`;
        window.open(url, '_blank');
      };

      const callGeminiApi = async (userPrompt, systemInstructionText) => {
        const apiKey = state.settings.apiKey || "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const payload = {
          contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
          systemInstruction: { parts: [{ text: systemInstructionText }] }
        };

        let retries = 3;
        let delay = 1000;
        while (retries > 0) {
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (response.ok) {
              const result = await response.json();
              return result.candidates?.[0]?.content?.parts?.[0]?.text || null;
            }
          } catch (err) {
            console.debug("API attempt failed, retrying...", err);
          }
          retries--;
          if (retries > 0) {
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
          }
        }
        return null;
      };

      const generateMorningBriefing = async () => {
        setShowBriefingModal(true);
        setBriefingLoading(true);

        const promptSummary = `
          Today's Life OS Data Summary:
          1. Pending Unpaid Bills: ${JSON.stringify(state.bills.filter(b => !b.paid))}
          2. Active Work & Freelance Tasks: ${JSON.stringify(state.workTasks.filter(w => w.status !== 'Done'))}
          3. Pending Urgent Errands: ${JSON.stringify(state.errands.filter(e => !e.done))}
          4. Canada & Personal Projects: ${JSON.stringify(state.projects)}
        `;

        const sysInstruction = `You are an executive Life OS Productivity Assistant. Write an encouraging, structured English morning briefing (3 short paragraphs) summarizing top 3 priorities for today, upcoming bill obligations, and progress on personal goals (including Canada relocation).`;

        const response = await callGeminiApi(promptSummary, sysInstruction);

        if (response) {
          setBriefingText(response);
        } else {
          const pendingBillsCount = state.bills.filter(b => !b.paid).length;
          const openWorkCount = state.workTasks.filter(w => w.status !== 'Done').length;
          const openErrands = state.errands.filter(e => !e.done).length;

          setBriefingText(`Good Morning! ☀️\n\nHere is your daily executive briefing:\n• You have **${openWorkCount} active work/freelance tasks** in progress.\n• You have **${pendingBillsCount} pending bills** due soon.\n• **${openErrands} personal errands** awaiting completion.\n\nPro-Tip: Complete your highest impact task before switching to administrative follow-ups!`);
        }
        setBriefingLoading(false);
      };

      return (

              </div>
            </div>

            <nav className="flex-1 space-y-1.5">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: 'Dashboard' },
                { id: 'work', label: 'Work & Freelance', icon: 'Briefcase' },
                { id: 'projects', label: 'Personal Projects', icon: 'FolderKanban' },
                { id: 'home', label: 'Home & Finance', icon: 'Home' },
                { id: 'errands', label: 'Errands & Tasks', icon: 'CheckSquare' },
                { id: 'ai', label: 'AI Agent Assistant', icon: 'Bot' },
              ].map(item => (

                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl font-medium transition-all duration-200 text-sm ${
                    activeTab === item.id 
                      ? 'bg-brand-600/20 text-brand-400 border border-brand-500/30' 
                      : 'text-gray-400 hover:bg-dark-hover hover:text-gray-200'
                  }`}
                >
                  <Icon name={item.icon} className={`w-5 h-5 ${activeTab === item.id ? 'text-brand-400' : 'text-gray-400'}`} />
                  <span>{item.label}</span>
                </button>
              ))}
            </nav>

            <div className="pt-4 border-t border-dark-border space-y-2">
              <button
                onClick={() => setShowQuickAdd(true)}
                className="w-full bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-600 text-white font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all glow-indigo text-sm"
              >

              </button>

              <button

              >
                <div className="flex items-center gap-2">
                  <Icon name="Settings" className="w-4 h-4" />
                  <span>Notification Dashboard</span>
                </div>
                {state.settings.userEmail && (

            </div>

          {}

                  </div>

                </div>
                <div className="hidden md:block">
                  <p className="text-xs text-gray-400">Current Date</p>
                  <p className="text-sm font-semibold text-gray-200">
                    {new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={generateMorningBriefing}
                  className="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all"
                >
                  <Icon name="Sparkles" className="w-4 h-4 text-amber-400" />
                  <span>AI Morning Briefing</span>
                </button>

                <button

                  className="md:hidden bg-brand-600 text-white p-2 rounded-xl"
                >
                  <Icon name="Plus" className="w-5 h-5" />
                </button>

                <button

                  className="md:hidden text-gray-400 p-2"

                  <Icon name="Settings" className="w-5 h-5" />

            <main className="p-4 md:p-6 max-w-7xl mx-auto w-full space-y-6">

              {toast && (

              {activeTab === 'dashboard' && (

              {activeTab === 'projects' && (

                />
              )}

              {activeTab === 'home' && (
                <HomeFinancesView

                />
              )}

              {activeTab === 'errands' && (

                  setState={setState} 
                  downloadAppleIcs={downloadAppleIcs}

    function WorkFreelanceView({ state, setState, downloadAppleIcs, openGoogleCalendar }) {
      const [filter, setFilter] = useState('All');

      const filteredTasks = state.workTasks.filter(t => {
        if (filter === 'Work') return t.type === 'Work';
        if (filter === 'Freelance') return t.type === 'Freelance';
        return true;
      });

      const moveTaskStatus = (taskId, newStatus) => {
        setState(prev => ({
          ...prev,
          workTasks: prev.workTasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t)
        }));
      };

      const togglePaymentStatus = (taskId) => {
        setState(prev => ({
          ...prev,
          workTasks: prev.workTasks.map(t => t.id === taskId ? { ...t, paymentStatus: t.paymentStatus === 'Paid' ? 'Pending' : 'Paid' } : t)
        }));
      };

      const deleteTask = (taskId) => {
        setState(prev => ({
          ...prev,
          workTasks: prev.workTasks.filter(t => t.id !== taskId)
        }));
      };

      const columns = ['To Do', 'In Progress', 'Waiting', 'Done'];
      const columnLabels = {
        'To Do': 'To Do',
        'In Progress': 'In Progress',
        'Waiting': 'Waiting for Client',
        'Done': 'Done'
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold text-white">Work & Freelance (Kanban)</h2>
              <p className="text-xs text-gray-400">Track client deliverables, primary job tasks, and financial payouts</p>
            </div>

            <div className="flex p-1 bg-dark-card border border-dark-border rounded-xl text-xs">
              {['All', 'Work', 'Freelance'].map(f => (
                <button
                  key={f}
                  onClick={() => setFilter(f)}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all ${
                    filter === f ? 'bg-brand-600 text-white' : 'text-gray-400 hover:text-gray-200'
                  }`}
                >
                  {f}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {columns.map(col => {
              const tasksInCol = filteredTasks.filter(t => t.status === col);
              return (
                <div key={col} className="bg-dark-card/50 border border-dark-border rounded-2xl p-4 flex flex-col min-h-[400px]">
                  <div className="flex items-center justify-between mb-3 pb-2 border-b border-dark-border">
                    <span className="font-bold text-sm text-gray-200">{columnLabels[col]}</span>
                    <span className="text-xs bg-dark-bg border border-dark-border px-2 py-0.5 rounded-full text-gray-400 font-bold">
                      {tasksInCol.length}
                    </span>
                  </div>

                  <div className="space-y-3 flex-1 overflow-y-auto">
                    {tasksInCol.map(task => (
                      <div key={task.id} className="glass-card p-3.5 rounded-xl border border-dark-border space-y-3 hover:border-brand-500/40 transition-all">
                        <div className="flex items-start justify-between gap-2">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                            task.type === 'Freelance' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-brand-500/10 text-brand-400 border border-brand-500/20'
                          }`}>
                            {task.type}
                          </span>
                          <button onClick={() => deleteTask(task.id)} className="text-gray-500 hover:text-rose-400">
                            <Icon name="Trash" className="w-3.5 h-3.5" />
                          </button>
                        </div>

                        <h4 className="font-bold text-sm text-white leading-snug">{task.title}</h4>
                        <p className="text-xs text-gray-400">Client: <span className="text-gray-200">{task.client}</span></p>

                        <div className="text-xs text-gray-400 flex items-center justify-between pt-2 border-t border-dark-border">

                          {task.amount > 0 && <span className="font-bold text-emerald-400">${task.amount}</span>}

                          <button
                            onClick={() => togglePaymentStatus(task.id)}
                            className={`w-full py-1 rounded-lg text-[11px] font-semibold border transition-all ${
                              task.paymentStatus === 'Paid'

                                : 'bg-amber-500/10 text-amber-400 border-amber-500/20'

                            {task.paymentStatus === 'Paid' ? 'Paid ✅' : 'Payment Pending ⏳'}
                          </button>
                        )}

                        <div className="flex items-center justify-between gap-1 pt-1">
                          <select
                            value={task.status}
                            onChange={(e) => moveTaskStatus(task.id, e.target.value)}
                            className="bg-dark-bg text-gray-300 text-[11px] rounded-lg px-2 py-1 border border-dark-border focus:outline-none w-full"
                          >
                            <option value="To Do">To Do</option>

    function PersonalProjectsView({ state, setState }) {
      const [selectedProject, setSelectedProject] = useState(state.projects[0]?.id || null);
      const [newIdeaTitle, setNewIdeaTitle] = useState('');
      const [newIdeaDesc, setNewIdeaDesc] = useState('');

      const activeProj = state.projects.find(p => p.id === selectedProject) || state.projects[0];

      const togglePhaseTask = (projId, phaseId, taskId) => {
        setState(prev => ({
          ...prev,
          projects: prev.projects.map(p => {
            if (p.id !== projId) return p;
            return {
              ...p,
              phases: p.phases.map(ph => {
                if (ph.id !== phaseId) return ph;
                return {
                  ...ph,
                  tasks: ph.tasks.map(t => t.id === taskId ? { ...t, done: !t.done } : t)
                };
              })
            };
          })
        }));
      };

      const handleAddIdea = (e) => {
        e.preventDefault();
        if (!newIdeaTitle.trim()) return;
        const idea = {
          id: 'i' + Date.now(),
          title: newIdeaTitle,
          desc: newIdeaDesc,
          tag: 'General'
        };
        setState(prev => ({ ...prev, ideas: [idea, ...prev.ideas] }));
        setNewIdeaTitle('');
        setNewIdeaDesc('');
      };

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-xl font-bold text-white">Personal Projects & Idea Incubator</h2>
            <p className="text-xs text-gray-400">Manage Canada relocation plans, side SaaS products, and future concepts</p>
          </div>

          <div className="flex flex-wrap gap-2">
            {state.projects.map(p => (
              <button
                key={p.id}
                onClick={() => setSelectedProject(p.id)}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all border ${
                  selectedProject === p.id 
                    ? 'bg-brand-600 text-white border-brand-500 shadow-md' 
                    : 'bg-dark-card text-gray-400 border-dark-border hover:bg-dark-hover'
                }`}
              >
                {p.title}
              </button>
            ))}
          </div>

          {activeProj && (
            <div className="glass-card p-6 rounded-2xl border border-dark-border space-y-6">
              <div>
                <h3 className="text-lg font-bold text-white">{activeProj.title}</h3>
                <p className="text-xs text-gray-400 mt-1">{activeProj.description}</p>
              </div>

              <div className="space-y-4">
                {activeProj.phases.map((phase) => {
                  const completedTasks = phase.tasks.filter(t => t.done).length;
                  const progressPct = Math.round((completedTasks / (phase.tasks.length || 1)) * 100);

                  return (
                    <div key={phase.id} className="bg-dark-bg p-4 rounded-xl border border-dark-border space-y-3">
                      <div className="flex items-center justify-between">
                        <h4 className="font-bold text-sm text-brand-400">{phase.title}</h4>
                        <span className="text-xs text-gray-400 font-semibold">{progressPct}% completed</span>
                      </div>

                      <div className="w-full bg-dark-card h-2 rounded-full overflow-hidden">
                        <div className="bg-brand-500 h-full transition-all duration-300" style={{ width: `${progressPct}%` }}></div>
                      </div>

                      <div className="space-y-2 pt-2">
                        {phase.tasks.map(task => (
                          <label key={task.id} className="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-dark-card/50 transition-all">
                            <input
                              type="checkbox"
                              checked={task.done}
                              onChange={() => togglePhaseTask(activeProj.id, phase.id, task.id)}
                              className="w-4 h-4 rounded border-gray-600 bg-dark-card text-brand-500 focus:ring-brand-500"
                            />
                            <span className={`text-sm ${task.done ? 'line-through text-gray-500' : 'text-gray-200'}`}>
                              {task.text}
                            </span>
                          </label>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <div className="glass-card p-6 rounded-2xl border border-dark-border space-y-4">
            <h3 className="font-bold text-white flex items-center gap-2 text-base">
              <Icon name="Sparkles" className="w-5 h-5 text-amber-400" />
              <span>Idea Incubator</span>
            </h3>

            <form onSubmit={handleAddIdea} className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <input
                type="text"
                placeholder="Idea title..."
                value={newIdeaTitle}
                onChange={(e) => setNewIdeaTitle(e.target.value)}
                className="bg-dark-bg border border-dark-border rounded-xl px-3.5 py-2 text-sm text-gray-200 focus:outline-none focus:border-brand-500"
              />
              <input
                type="text"
                placeholder="Quick notes or description..."
                value={newIdeaDesc}
                onChange={(e) => setNewIdeaDesc(e.target.value)}
                className="bg-dark-bg border border-dark-border rounded-xl px-3.5 py-2 text-sm text-gray-200 focus:outline-none focus:border-brand-500"
              />
              <button
                type="submit"
                className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition-all"
              >
                + Log Idea
              </button>
            </form>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
              {state.ideas.map(idea => (
                <div key={idea.id} className="bg-dark-bg p-3.5 rounded-xl border border-dark-border space-y-1">
                  <div className="flex items-center justify-between">
                    <h5 className="font-bold text-sm text-amber-300">{idea.title}</h5>
                    <span className="text-[10px] px-2 py-0.5 rounded bg-dark-card border border-dark-border text-gray-400">{idea.tag}</span>
                  </div>
                  <p className="text-xs text-gray-400">{idea.desc}</p>
                </div>

          </div>
        </div>

    function AiAssistantView({ state, setState, showToast }) {
      const [messages, setMessages] = useState([
        { role: 'assistant', text: 'Hello! I am your AI Life OS Agent. You can speak or type to me naturally to log tasks, record bills, add shopping items, or ask about your schedule!' }
      ]);
      const [inputText, setInputText] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!inputText.trim() || loading) return;

        const userMsg = inputText;
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setInputText('');
        setLoading(true);

        const apiKey = state.settings.apiKey || "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const systemPrompt = `
          You are an AI Executive Life OS Agent managing user schedule, bills, freelance tasks, and shopping.
          Current User State:
          - Bills: ${JSON.stringify(state.bills)}
          - Work/Freelance: ${JSON.stringify(state.workTasks)}
          - Shopping: ${JSON.stringify(state.shopping)}
          - Errands: ${JSON.stringify(state.errands)}

          Interpret user intents (either questions or requests to add bills/tasks/shopping/errands).
          Respond in concise conversational English AND output strict JSON according to the schema:
          {
            "reply": "Conversational friendly English answer",
            "actionType": "ADD_BILL" | "ADD_WORK_TASK" | "ADD_SHOPPING_ITEM" | "ADD_ERRAND" | "NONE",
            "actionData": {
              "name": "Title or name",
              "amount": 0,
              "dueDate": "YYYY-MM-DD or day number",
              "client": "Client name",
              "category": "Supermarket" | "Home" | "Tech" | "Utilities",
              "text": "Shopping item text",
              "priority": "High" | "Medium" | "Low"
            }
          }
        `;

        const payload = {
          contents: [{ role: 'user', parts: [{ text: userMsg }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                reply: { type: "STRING" },
                actionType: { type: "STRING", enum: ["ADD_BILL", "ADD_WORK_TASK", "ADD_SHOPPING_ITEM", "ADD_ERRAND", "NONE"] },
                actionData: {
                  type: "OBJECT",
                  properties: {
                    name: { type: "STRING" },
                    amount: { type: "NUMBER" },
                    dueDate: { type: "STRING" },
                    client: { type: "STRING" },
                    category: { type: "STRING" },
                    text: { type: "STRING" },
                    priority: { type: "STRING" }
                  }
                }
              },
              required: ["reply", "actionType"]
            }
          }
        };

        try {
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            const result = await res.json();
            const textResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (textResponse) {
              const parsed = JSON.parse(textResponse);
              setMessages(prev => [...prev, { role: 'assistant', text: parsed.reply }]);

              if (parsed.actionType === 'ADD_BILL' && parsed.actionData) {
                const bill = { id: 'b' + Date.now(), name: parsed.actionData.name || 'New Bill', amount: parsed.actionData.amount || 50, category: 'Utilities', dueDate: parsed.actionData.dueDate || '25', paid: false };
                setState(prev => ({ ...prev, bills: [...prev.bills, bill] }));
                showToast('Bill logged automatically by AI Agent!');
              } else if (parsed.actionType === 'ADD_WORK_TASK' && parsed.actionData) {
                const task = { id: 'w' + Date.now(), title: parsed.actionData.name || 'New Task', client: parsed.actionData.client || 'Client', type: 'Freelance', deadline: new Date().toISOString().slice(0, 10), amount: parsed.actionData.amount || 0, status: 'To Do', paymentStatus: 'Pending' };
                setState(prev => ({ ...prev, workTasks: [...prev.workTasks, task] }));
                showToast('Task added to Work & Freelance!');
              } else if (parsed.actionType === 'ADD_SHOPPING_ITEM' && parsed.actionData) {
                const shop = { id: 's' + Date.now(), text: parsed.actionData.text || parsed.actionData.name || 'Item', category: parsed.actionData.category || 'Supermarket', checked: false };
                setState(prev => ({ ...prev, shopping: [...prev.shopping, shop] }));
                showToast('Item added to Shopping List!');
              } else if (parsed.actionType === 'ADD_ERRAND' && parsed.actionData) {
                const err = { id: 'e' + Date.now(), title: parsed.actionData.name || 'New Errand', priority: parsed.actionData.priority || 'Medium', dueDate: new Date().toISOString().slice(0, 10), done: false };
                setState(prev => ({ ...prev, errands: [...prev.errands, err] }));
                showToast('Errand logged!');
              }
            }
          } else {
            setMessages(prev => [...prev, { role: 'assistant', text: 'Error connecting to AI backend. Check your API settings.' }]);
          }
        } catch (e) {
          setMessages(prev => [...prev, { role: 'assistant', text: 'Network connection failed. Please retry.' }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="glass-card rounded-2xl border border-dark-border flex flex-col h-[600px]">
          <div className="p-4 border-b border-dark-border flex items-center gap-3">
            <div className="p-2 rounded-xl bg-brand-600/20 text-brand-400 border border-brand-500/30">
              <Icon name="Bot" className="w-6 h-6" />
            </div>
            <div>
              <h3 className="font-bold text-white text-base">Gemini AI Command Agent</h3>
              <p className="text-xs text-gray-400">Speak or type prompts to record tasks, bills, and get daily summaries</p>
            </div>
          </div>

          <div className="flex-1 p-4 overflow-y-auto space-y-3">
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[80%] p-3.5 rounded-2xl text-sm leading-relaxed ${
                  m.role === 'user' 
                    ? 'bg-brand-600 text-white rounded-tr-none' 
                    : 'bg-dark-bg border border-dark-border text-gray-200 rounded-tl-none'
                }`}>
                  {m.text}
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex justify-start">
                <div className="bg-dark-bg border border-dark-border p-3.5 rounded-2xl text-xs text-gray-400 animate-pulse">
                  Processing input and updating state... 🧠
                </div>
              </div>
            )}
          </div>

          <div className="p-2 border-t border-dark-border bg-dark-bg/50 flex gap-2 overflow-x-auto text-[11px]">
            <button onClick={() => setInputText("Add electricity bill $90 due on 25th")} className="px-2.5 py-1 rounded-lg bg-dark-card border border-dark-border text-gray-300 whitespace-nowrap hover:bg-dark-hover">
              + Bill: Electricity $90
            </button>
            <button onClick={() => setInputText("Add new freelance design task for Horizon Tech $500")} className="px-2.5 py-1 rounded-lg bg-dark-card border border-dark-border text-gray-300 whitespace-nowrap hover:bg-dark-hover">
              + Freelance task: Horizon Tech
            </button>
            <button onClick={() => setInputText("Add coffee beans to shopping list")} className="px-2.5 py-1 rounded-lg bg-dark-card border border-dark-border text-gray-300 whitespace-nowrap hover:bg-dark-hover">
              + Shopping: Coffee beans
            </button>
          </div>

          <form onSubmit={handleSendMessage} className="p-3 border-t border-dark-border flex gap-2">
            <input
              type="text"
              placeholder="e.g. Add internet bill $45 due on 28th..."
              value={inputText}
              onChange={(e) => setInputText(e.target.value)}
              className="bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-brand-500 flex-1"
            />
            <button
              type="submit"
              disabled={loading}
              className="bg-brand-600 hover:bg-brand-500 text-white font-bold px-4 py-2.5 rounded-xl transition-all flex items-center justify-center"
            >
              <Icon name="Send" className="w-4 h-4" />
            </button>
          </form>
        </div>
      );
    }

                    onClick={handleTestNotification}
                    disabled={testingEmail}
                    className="bg-brand-600/20 hover:bg-brand-600/30 text-brand-400 border border-brand-500/30 text-xs font-semibold px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap"
                  >
                    {testingEmail ? (
                      <Icon name="RefreshCw" className="w-3.5 h-3.5 animate-spin" />
                    ) : (
                      <Icon name="Send" className="w-3.5 h-3.5" />
                    )}
                    <span>Test Email</span>
                  </button>
                </div>
                <p className="text-[11px] text-gray-500">
                  Daily briefings and urgent bill reminders will be dispatched to this email.
                </p>
              </div>

              {/* Notification Toggles */}
              <div className="bg-dark-bg p-4 rounded-xl border border-dark-border space-y-3">
                <h4 className="text-xs font-bold text-gray-300 uppercase tracking-wider">Alert Preferences</h4>

                <label className="flex items-center justify-between cursor-pointer py-1">
                  <div className="flex items-center gap-2.5">
                    <Icon name="Bell" className="w-4 h-4 text-amber-400" />
                    <div>
                      <p className="text-xs font-semibold text-gray-200">Master Email Notifications</p>
                      <p className="text-[10px] text-gray-400">Enable or disable all automated email triggers</p>
                    </div>
                  </div>
                  <input
                    type="checkbox"
                    checked={enableNotifications}
                    onChange={(e) => setEnableNotifications(e.target.checked)}
                    className="w-4 h-4 rounded border-gray-600 bg-dark-card text-brand-500"
                  />
                </label>

                <label className="flex items-center justify-between cursor-pointer py-1 border-t border-dark-border/50 pt-2">
                  <div className="flex items-center gap-2.5">
                    <Icon name="Sparkles" className="w-4 h-4 text-brand-400" />
                    <div>
                      <p className="text-xs font-semibold text-gray-200">Daily Morning Briefing Email</p>
                      <p className="text-[10px] text-gray-400">Receive morning summary at 8:00 AM</p>
                    </div>
                  </div>
                  <input
                    type="checkbox"
                    disabled={!enableNotifications}
                    checked={notifyDailyBriefing}
                    onChange={(e) => setNotifyDailyBriefing(e.target.checked)}
                    className="w-4 h-4 rounded border-gray-600 bg-dark-card text-brand-500 disabled:opacity-40"
                  />
                </label>

                <label className="flex items-center justify-between cursor-pointer py-1 border-t border-dark-border/50 pt-2">
                  <div className="flex items-center gap-2.5">
                    <Icon name="AlertCircle" className="w-4 h-4 text-rose-400" />
                    <div>
                      <p className="text-xs font-semibold text-gray-200">Bill Due Date Alerts</p>
                      <p className="text-[10px] text-gray-400">Remind 3 days before bill due dates</p>
                    </div>
                  </div>
                  <input
                    type="checkbox"
                    disabled={!enableNotifications}
                    checked={notifyBillReminders}
                    onChange={(e) => setNotifyBillReminders(e.target.checked)}
                    className="w-4 h-4 rounded border-gray-600 bg-dark-card text-brand-500 disabled:opacity-40"
                  />
                </label>

                <label className="flex items-center justify-between cursor-pointer py-1 border-t border-dark-border/50 pt-2">
                  <div className="flex items-center gap-2.5">
                    <Icon name="Clock" className="w-4 h-4 text-emerald-400" />
                    <div>
                      <p className="text-xs font-semibold text-gray-200">Freelance & Project Deadline Alerts</p>
                      <p className="text-[10px] text-gray-400">Alerts when deliverables approach deadline</p>
                    </div>
                  </div>
                  <input
                    type="checkbox"
                    disabled={!enableNotifications}
                    checked={notifyDeadlines}
                    onChange={(e) => setNotifyDeadlines(e.target.checked)}
                    className="w-4 h-4 rounded border-gray-600 bg-dark-card text-brand-500 disabled:opacity-40"
                  />
                </label>
              </div>

              {/* Gemini API Key Section */}
              <div className="bg-dark-bg p-4 rounded-xl border border-dark-border space-y-2">
                <label className="text-xs font-semibold text-gray-300 block">Google Gemini API Key (Optional Override)</label>
                <input
                  type="password"
                  placeholder="AIzaSy..."
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  className="w-full bg-dark-card border border-dark-border rounded-xl px-3.5 py-2 text-sm text-gray-200 focus:outline-none focus:border-brand-500"
                />
                <p className="text-[10px] text-gray-500">
                  Leave empty to use built-in Canvas system runtime key.
                </p>
              </div>

              <div className="pt-2 flex flex-col gap-2">
                <button
                  type="submit"
                  className="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg glow-indigo"
                >
                  Save Notification Preferences
                </button>

                <button
                  type="button"
                  onClick={handleResetData}
                  className="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 font-semibold py-2 rounded-xl text-xs transition-all"
                >
                  Reset All System Data
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LifeOSApp />);
  </script>
</body>
</html>
