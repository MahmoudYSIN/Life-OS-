<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Life OS | Personal Operating System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0b0f17;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0b0f17;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Default Mock Initial Data
    const defaultData = {
      accounts: {
        cash: 4400,
        bank: 19800,
        creditCard: 9200
      },
      workTasks: [
        { id: '1', title: 'Real Estate Ad Campaign Meta Setup', client: 'Citiway RE', deadline: '2026-09-28', tag: 'Work', amount: 3100, paymentStatus: 'Paid', status: 'In Progress' },
        { id: '2', title: 'Aesthetic Studio Landing Page UX', client: 'Rana Glow Studio', deadline: '2026-09-30', tag: 'Freelance', amount: 4400, paymentStatus: 'Pending', status: 'To Do' },
        { id: '3', title: 'Zoho CRM Lead Automation Pipeline', client: 'Citiway RE', deadline: '2026-10-05', tag: 'Work', amount: 2200, paymentStatus: 'Pending', status: 'Waiting' }
      ],
      personalProjects: [
        {
          id: 'proj-canada',
          title: 'Canada Relocation Plan',
          category: 'Immigration & Setup',
          phases: [
            { name: 'Phase 1: Documents & Express Entry', tasks: [{ id: 'p1-1', title: 'ECA Degree Equivalency', done: true }, { id: 'p1-2', title: 'IELTS General Exam prep', done: true }] },
            { name: 'Phase 2: Pre-Arrival Financials & Setup', tasks: [{ id: 'p2-1', title: 'Proof of Funds transfer preparation', done: false }, { id: 'p2-2', title: 'Temporary accommodation booking', done: false }] }
          ]
        }
      ],
      ideas: [
        { id: 'id-1', title: 'Real Estate AI Voice Lead Qualification Agent', tag: 'AI/SaaS', date: '2026-09-15' },
        { id: 'id-2', title: 'Personal Brand Portfolio Website Automation', tag: 'Marketing', date: '2026-09-20' }
      ],
      bills: [
        { id: 'b1', name: 'Apartment Rent', amount: 4400, dueDay: 1, status: 'Paid', paidFrom: 'bank' },
        { id: 'b2', name: 'Electricity & Water Utility', amount: 400, dueDay: 25, status: 'Paid', paidFrom: 'creditCard' },
        { id: 'b3', name: 'High-Speed Fiber Internet', amount: 380, dueDay: 28, status: 'Paid', paidFrom: 'bank' },
        { id: 'b4', name: 'Canada Visa & Medical Processing', amount: 920, dueDay: 30, status: 'Paid', paidFrom: 'creditCard' }
      ],
      receivables: [
        { id: 'r1', source: 'Citiway RE Unpaid Commission', amount: 5500, dueDate: '2026-09-30', status: 'Pending', receivedTo: null },
        { id: 'r2', source: 'Rana Glow Studio Project Milestone', amount: 3200, dueDate: '2026-10-05', status: 'Pending', receivedTo: null }
      ],
      shoppingItems: [
        { id: 's1', name: 'Specialty Whole Bean Coffee', category: 'Supermarket', done: true },
        { id: 's2', name: 'Chicken Breasts & Cold-Pressed Olive Oil', category: 'Supermarket', done: true },
        { id: 's3', name: 'Surface Cleaner & Large Trash Bags', category: 'Home Supplies', done: true },
        { id: 's4', name: 'USB-C Anker Fast-Charging Cable for MacBook', category: 'Tech & Gear', done: true }
      ],
      errands: [
        { id: 'e1', name: 'Book routine car maintenance for Hyundai Tucson', priority: 'High', dueDate: '2026-09-26', done: false },
        { id: 'e2', name: 'Renew domain registration on Spaceship', priority: 'Medium', dueDate: '2026-10-01', done: false }
      ],
      settings: {
        email: 'user@example.com',
        masterEmailAlerts: true,
        morningBriefing: true,
        billAlerts: true,
        projectDeadlineAlerts: true,
        geminiApiKey: ''
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // State Management with LocalStorage
      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('life_os_accounts');
        return saved ? JSON.parse(saved) : defaultData.accounts;
      });

      const [workTasks, setWorkTasks] = useState(() => {
        const saved = localStorage.getItem('life_os_work_tasks');
        return saved ? JSON.parse(saved) : defaultData.workTasks;
      });

      const [personalProjects, setPersonalProjects] = useState(() => {
        const saved = localStorage.getItem('life_os_personal_projects');
        return saved ? JSON.parse(saved) : defaultData.personalProjects;
      });

      const [ideas, setIdeas] = useState(() => {
        const saved = localStorage.getItem('life_os_ideas');
        return saved ? JSON.parse(saved) : defaultData.ideas;
      });

      const [bills, setBills] = useState(() => {
        const saved = localStorage.getItem('life_os_bills');
        return saved ? JSON.parse(saved) : defaultData.bills;
      });

      const [receivables, setReceivables] = useState(() => {
        const saved = localStorage.getItem('life_os_receivables');
        return saved ? JSON.parse(saved) : defaultData.receivables;
      });

      const [shoppingItems, setShoppingItems] = useState(() => {
        const saved = localStorage.getItem('life_os_shopping');
        return saved ? JSON.parse(saved) : defaultData.shoppingItems;
      });

      const [errands, setErrands] = useState(() => {
        const saved = localStorage.getItem('life_os_errands');
        return saved ? JSON.parse(saved) : defaultData.errands;
      });

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('life_os_settings');
        return saved ? JSON.parse(saved) : defaultData.settings;
      });

      const [isNotificationModalOpen, setIsNotificationModalOpen] = useState(false);
      const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);

      // Save to LocalStorage effects
      useEffect(() => { localStorage.setItem('life_os_accounts', JSON.stringify(accounts)); }, [accounts]);
      useEffect(() => { localStorage.setItem('life_os_work_tasks', JSON.stringify(workTasks)); }, [workTasks]);
      useEffect(() => { localStorage.setItem('life_os_personal_projects', JSON.stringify(personalProjects)); }, [personalProjects]);
      useEffect(() => { localStorage.setItem('life_os_ideas', JSON.stringify(ideas)); }, [ideas]);
      useEffect(() => { localStorage.setItem('life_os_bills', JSON.stringify(bills)); }, [bills]);
      useEffect(() => { localStorage.setItem('life_os_receivables', JSON.stringify(receivables)); }, [receivables]);
      useEffect(() => { localStorage.setItem('life_os_shopping', JSON.stringify(shoppingItems)); }, [shoppingItems]);
      useEffect(() => { localStorage.setItem('life_os_errands', JSON.stringify(errands)); }, [errands]);
      useEffect(() => { localStorage.setItem('life_os_settings', JSON.stringify(settings)); }, [settings]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <div className="flex h-screen bg-[#0b0f17] text-slate-100 overflow-hidden">
          {/* Sidebar Desktop */}
          <aside className="hidden md:flex flex-col w-64 border-r border-slate-800 bg-[#0d131f] p-4">
            <div className="flex items-center gap-3 px-2 py-3 mb-6">
              <div className="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center font-bold text-white shadow-lg shadow-brand-500/20">
                <i data-lucide="zap" className="w-5 h-5"></i>
              </div>
              <div>
                <h1 className="font-bold text-slate-100 leading-none">Life OS</h1>
                <span className="text-xs text-slate-400">Personal System</span>
              </div>
            </div>

            <nav className="flex-1 space-y-1">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'work', label: 'Work & Freelance', icon: 'briefcase' },
                { id: 'projects', label: 'Personal Projects', icon: 'folder-kanban' },
                { id: 'home', label: 'Home & Finance', icon: 'home' },
                { id: 'errands', label: 'Errands & Tasks', icon: 'check-square' },
                { id: 'ai-agent', label: 'AI Agent Assistant', icon: 'bot' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${
                    activeTab === item.id 
                      ? 'bg-brand-600/20 text-brand-400 border border-brand-500/30' 
                      : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                  }`}
                >
                  <i data-lucide={item.icon} className="w-4 h-4"></i>
                  {item.label}
                </button>
              ))}
            </nav>

            <div className="pt-4 border-t border-slate-800/80 space-y-2">
              <button
                onClick={() => setIsQuickAddOpen(true)}
                className="w-full bg-brand-600 hover:bg-brand-500 text-white py-2.5 px-4 rounded-xl font-medium text-sm transition-all shadow-lg shadow-brand-600/25 flex items-center justify-center gap-2"
              >
                <i data-lucide="plus" className="w-4 h-4"></i>
                + Quick Add
              </button>

              <button
                onClick={() => setIsNotificationModalOpen(true)}
                className="w-full flex items-center justify-between text-xs text-slate-400 hover:text-slate-200 p-2 rounded-lg hover:bg-slate-800/50"
              >
                <span className="flex items-center gap-2">
                  <i data-lucide="bell" className="w-4 h-4 text-brand-400"></i>
                  Notification Dashboard
                </span>
                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col min-w-0 overflow-hidden">
            {/* Top Bar Header */}
            <header className="h-16 border-b border-slate-800/80 bg-[#0d131f]/80 backdrop-blur-md px-6 flex items-center justify-between">
              <div>
                <span className="text-xs text-slate-400">Current Date</span>
                <p className="text-sm font-semibold text-slate-200">
                  {new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                </p>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setActiveTab('ai-agent')}
                  className="bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-all"
                >
                  <i data-lucide="sparkles" className="w-3.5 h-3.5 text-amber-400"></i>
                  AI Morning Briefing
                </button>
              </div>
            </header>

            {/* View Switching */}
            <div className="flex-1 overflow-y-auto custom-scrollbar p-6">
              {activeTab === 'dashboard' && (
                <DashboardView 
                  workTasks={workTasks} 
                  bills={bills} 
                  receivables={receivables}
                  errands={errands}
                  accounts={accounts}
                  setActiveTab={setActiveTab} 
                />
              )}
              {activeTab === 'work' && (
                <WorkFreelanceView 
                  workTasks={workTasks} 
                  setWorkTasks={setWorkTasks} 
                />
              )}
              {activeTab === 'projects' && (
                <PersonalProjectsView 
                  personalProjects={personalProjects} 
                  setPersonalProjects={setPersonalProjects}
                  ideas={ideas}
                  setIdeas={setIdeas}
                />
              )}
              {activeTab === 'home' && (
                <HomeFinanceView 
                  bills={bills} 
                  setBills={setBills}
                  receivables={receivables}
                  setReceivables={setReceivables}
                  shoppingItems={shoppingItems}
                  setShoppingItems={setShoppingItems}
                  accounts={accounts}
                  setAccounts={setAccounts}
                />
              )}
              {activeTab === 'errands' && (
                <ErrandsView 
                  errands={errands} 
                  setErrands={setErrands} 
                />
              )}
              {activeTab === 'ai-agent' && (
                <AiAgentView 
                  workTasks={workTasks} setWorkTasks={setWorkTasks}
                  bills={bills} setBills={setBills}
                  errands={errands} setErrands={setErrands}
                  settings={settings}
                />
              )}
            </div>

            {/* Mobile Bottom Navigation */}
            <nav className="md:hidden flex items-center justify-around border-t border-slate-800 bg-[#0d131f] py-2 px-1">
              {[
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Home' },
                { id: 'work', icon: 'briefcase', label: 'Work' },
                { id: 'projects', icon: 'folder-kanban', label: 'Projects' },
                { id: 'home', icon: 'home', label: 'Finance' },
                { id: 'errands', icon: 'check-square', label: 'Tasks' },
                { id: 'ai-agent', icon: 'bot', label: 'AI' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center gap-1 p-1.5 text-xs ${
                    activeTab === item.id ? 'text-brand-400 font-medium' : 'text-slate-400'
                  }`}
                >
                  <i data-lucide={item.icon} className="w-5 h-5"></i>
                  <span>{item.label}</span>
                </button>
              ))}
            </nav>
          </main>

          {/* Settings / Notification Dashboard Modal */}
          {isNotificationModalOpen && (
            <NotificationDashboardModal
              settings={settings}
              setSettings={setSettings}
              onClose={() => setIsNotificationModalOpen(false)}
            />
          )}

          {/* Quick Add Modal */}
          {isQuickAddOpen && (
            <QuickAddModal
              onClose={() => setIsQuickAddOpen(false)}
              setWorkTasks={setWorkTasks}
              setBills={setBills}
              setReceivables={setReceivables}
              setErrands={setErrands}
            />
          )}
        </div>
      );
    }

    // 1. DASHBOARD VIEW
    function DashboardView({ workTasks, bills, receivables, errands, accounts, setActiveTab }) {
      const urgentBills = bills.filter(b => b.status === 'Unpaid');
      const pendingReceivablesTotal = receivables
        .filter(r => r.status === 'Pending')
        .reduce((sum, r) => sum + (r.amount || 0), 0);
      const totalPendingEarnings = workTasks
        .filter(t => t.paymentStatus === 'Pending')
        .reduce((sum, t) => sum + (t.amount || 0), 0);
      const netWorth = (accounts.cash || 0) + (accounts.bank || 0) + (accounts.creditCard || 0);

      return (
        <div className="space-y-6 max-w-7xl mx-auto">
          {/* Welcome Banner */}
          <div className="bg-gradient-to-r from-brand-900/40 via-slate-900 to-slate-900 border border-brand-500/20 rounded-2xl p-6 relative overflow-hidden">
            <div className="relative z-10 space-y-2">
              <h2 className="text-2xl font-bold text-white">Welcome back, Mahmoud</h2>
              <p className="text-slate-400 text-sm max-w-xl">
                Here is your unified life overview. You have {urgentBills.length} unpaid bill(s) and AED {pendingReceivablesTotal.toLocaleString()} in pending receivables due to you.
              </p>
            </div>
          </div>

          {/* Financial Overview Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-[#0d131f] border border-slate-800 rounded-xl p-4 space-y-2">
              <div className="flex items-center justify-between text-slate-400 text-xs">
                <span>Total Liquidity / Net</span>
                <i data-lucide="wallet" className="w-4 h-4 text-brand-400"></i>
              </div>
              <p className="text-2xl font-bold text-white">AED {netWorth.toLocaleString()}</p>
              <p className="text-xs text-slate-400">Combined Cash + Bank + Cards</p>
            </div>

            <div className="bg-[#0d131f] border border-slate-800 rounded-xl p-4 space-y-2">
              <div className="flex items-center justify-between text-slate-400 text-xs">
                <span>Pending Receivables</span>
                <i data-lucide="arrow-down-left" className="w-4 h-4 text-emerald-400"></i>
              </div>
              <p className="text-2xl font-bold text-emerald-400">AED {pendingReceivablesTotal.toLocaleString()}</p>
              <p className="text-xs text-slate-400">Unpaid Salaries & Invoices</p>
            </div>

            <div className="bg-[#0d131f] border border-slate-800 rounded-xl p-4 space-y-2">
              <div className="flex items-center justify-between text-slate-400 text-xs">
                <span>Unpaid Bills</span>
                <i data-lucide="alert-circle" className="w-4 h-4 text-amber-400"></i>
              </div>
              <p className="text-2xl font-bold text-amber-400">{urgentBills.length}</p>
              <p className="text-xs text-slate-400">Requires attention</p>
            </div>

            <div className="bg-[#0d131f] border border-slate-800 rounded-xl p-4 space-y-2">
              <div className="flex items-center justify-between text-slate-400 text-xs">
                <span>Active Tasks & Errands</span>
                <i data-lucide="check-square" className="w-4 h-4 text-blue-400"></i>
              </div>
              <p className="text-2xl font-bold text-white">{errands.filter(e => !e.done).length}</p>
              <p className="text-xs text-slate-400">Pending action items</p>
            </div>
          </div>

          {/* Quick Priorities */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-[#0d131f] border border-slate-800 rounded-2xl p-5 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 className="font-semibold text-slate-200 flex items-center gap-2 text-sm">
                  <i data-lucide="alert-circle" className="w-4 h-4 text-amber-400"></i>
                  Upcoming Bills
                </h3>
                <button onClick={() => setActiveTab('home')} className="text-xs text-brand-400 hover:underline">
                  Manage Bills →
                </button>
              </div>

              <div className="space-y-2">
                {bills.slice(0, 4).map(bill => (
                  <div key={bill.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-900/60 border border-slate-800/80">
                    <div>
                      <p className="text-sm font-medium text-slate-200">{bill.name}</p>
                      <span className="text-xs text-slate-400">Due Day {bill.dueDay} of month</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="font-bold text-sm text-slate-100">AED {bill.amount}</span>
                      <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${
                        bill.status === 'Paid' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                      }`}>
                        {bill.status}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-[#0d131f] border border-slate-800 rounded-2xl p-5 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 className="font-semibold text-slate-200 flex items-center gap-2 text-sm">
                  <i data-lucide="clock" className="w-4 h-4 text-brand-400"></i>
                  Active Work & Deliverables
                </h3>
                <button onClick={() => setActiveTab('work')} className="text-xs text-brand-400 hover:underline">
                  Kanban Board →
                </button>
              </div>

              <div className="space-y-2">
                {workTasks.slice(0, 4).map(task => (
                  <div key={task.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-900/60 border border-slate-800/80">
                    <div>
                      <p className="text-sm font-medium text-slate-200">{task.title}</p>
                      <span className="text-xs text-slate-400">{task.client} • Due {task.deadline}</span>
                    </div>
                    <span className="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 font-medium border border-slate-700">
                      {task.status}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 2. WORK & FREELANCE VIEW
    function WorkFreelanceView({ workTasks, setWorkTasks }) {
      const [filter, setFilter] = useState('All');

      const filteredTasks = workTasks.filter(t => filter === 'All' || t.tag === filter);

      const updateTaskStatus = (taskId, newStatus) => {
        setWorkTasks(prev => prev.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
      };

      const togglePaymentStatus = (taskId) => {
        setWorkTasks(prev => prev.map(t => t.id === taskId ? { ...t, paymentStatus: t.paymentStatus === 'Paid' ? 'Pending' : 'Paid' } : t));
      };

      const deleteTask = (taskId) => {
        setWorkTasks(prev => prev.filter(t => t.id !== taskId));
      };

      const columns = ['To Do', 'In Progress', 'Waiting', 'Done'];

      return (
        <div className="space-y-6 max-w-7xl mx-auto">
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold text-white">Work & Freelance Management</h2>
              <p className="text-xs text-slate-400">Track client deliverables, status boards, and earnings</p>
            </div>

            <div className="flex items-center gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
              {['All', 'Work', 'Freelance'].map(f => (
                <button
                  key={f}
                  onClick={() => setFilter(f)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                    filter === f ? 'bg-brand-600 text-white' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f}
                </button>
              ))}
            </div>
          </div>

          {/* Kanban Columns */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {columns.map(col => {
              const colTasks = filteredTasks.filter(t => t.status === col);
              return (
                <div key={col} className="bg-[#0d131f] border border-slate-800/80 rounded-2xl p-4 flex flex-col min-h-[500px]">
                  <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-2">
                    <span className="font-semibold text-sm text-slate-200">{col}</span>

              ...phase,

    // 4. HOME & FINANCE VIEW
    function HomeFinanceView({ bills, setBills, receivables, setReceivables, shoppingItems, setShoppingItems, accounts, setAccounts }) {
      const [newShopItem, setNewShopItem] = useState('');
      const [shopCategory, setShopCategory] = useState('Supermarket');
      const [isEditAccountsOpen, setIsEditAccountsOpen] = useState(false);
      const [tempAccounts, setTempAccounts] = useState({ ...accounts });

      // State for adding new Receivable directly
      const [newRecSource, setNewRecSource] = useState('');
      const [newRecAmount, setNewRecAmount] = useState('');
      const [newRecDate, setNewRecDate] = useState('');

      // Modal states
      const [pendingPaidBillId, setPendingPaidBillId] = useState(null);
      const [pendingReceiveId, setPendingReceiveId] = useState(null);

      // Handle Bill Delete
      const handleDeleteBill = (id) => {
        setBills(bills.filter(b => b.id !== id));
      };

      // Handle Receivable Delete
      const handleDeleteReceivable = (id) => {
        setReceivables(receivables.filter(r => r.id !== id));
      };

      // Handle Add Receivable
      const handleAddReceivable = (e) => {
        e.preventDefault();
        if (!newRecSource.trim() || !newRecAmount) return;
        setReceivables([
          ...receivables,
          {
            id: 'r-' + Date.now(),
            source: newRecSource,
            amount: parseFloat(newRecAmount) || 0,
            dueDate: newRecDate || 'Pending',
            status: 'Pending',
            receivedTo: null
          }
        ]);
        setNewRecSource('');
        setNewRecAmount('');
        setNewRecDate('');
      };

      // Handle Bill Status Toggle
      const initiateToggleBillStatus = (bill) => {
        if (bill.status === 'Unpaid') {
          setPendingPaidBillId(bill.id);
        } else {
          const paidFrom = bill.paidFrom || 'bank';
          setAccounts(prev => ({
            ...prev,
            [paidFrom]: (prev[paidFrom] || 0) + bill.amount
          }));
          setBills(prev => prev.map(b => b.id === bill.id ? { ...b, status: 'Unpaid', paidFrom: null } : b));
        }
      };

      const confirmPayBill = (accountType) => {
        const bill = bills.find(b => b.id === pendingPaidBillId);
        if (!bill) return;

        setAccounts(prev => ({
          ...prev,
          [accountType]: (prev[accountType] || 0) - bill.amount
        }));

        setBills(prev => prev.map(b => b.id === pendingPaidBillId ? { ...b, status: 'Paid', paidFrom: accountType } : b));
        setPendingPaidBillId(null);
      };

      // Handle Receivable Status Toggle
      const initiateToggleReceivableStatus = (rec) => {
        if (rec.status === 'Pending') {
          setPendingReceiveId(rec.id);
        } else {
          // Revert back to Pending: deduct the amount from deposit account
          const receivedTo = rec.receivedTo || 'bank';
          setAccounts(prev => ({
            ...prev,
            [receivedTo]: Math.max(0, (prev[receivedTo] || 0) - rec.amount)
          }));
          setReceivables(prev => prev.map(r => r.id === rec.id ? { ...r, status: 'Pending', receivedTo: null } : r));
        }
      };

      const confirmReceiveMoney = (accountType) => {
        const rec = receivables.find(r => r.id === pendingReceiveId);
        if (!rec) return;

        // Deposit amount to selected account
        setAccounts(prev => ({
          ...prev,
          [accountType]: (prev[accountType] || 0) + rec.amount
        }));

        setReceivables(prev => prev.map(r => r.id === pendingReceiveId ? { ...r, status: 'Received', receivedTo: accountType } : r));
        setPendingReceiveId(null);
      };

      const handleSaveAccounts = (e) => {
        e.preventDefault();
        setAccounts({
          cash: parseFloat(tempAccounts.cash) || 0,
          bank: parseFloat(tempAccounts.bank) || 0,
          creditCard: parseFloat(tempAccounts.creditCard) || 0,
        });
        setIsEditAccountsOpen(false);
      };

      const toggleShopItem = (id) => {
        setShoppingItems(prev => prev.map(s => s.id === id ? { ...s, done: !s.done } : s));
      };

      const handleAddShoppingItem = (e) => {
        e.preventDefault();
        if (!newShopItem.trim()) return;
        setShoppingItems([
          ...shoppingItems,
          { id: 's-' + Date.now(), name: newShopItem, category: shopCategory, done: false }
        ]);
        setNewShopItem('');
      };

      const downloadIcs = (bill) => {
        const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:Pay ${bill.name}\nDESCRIPTION:Bill Payment of AED ${bill.amount}\nSTATUS:CONFIRMED\nEND:VEVENT\nEND:VCALENDAR`;
        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${bill.name.replace(/\s+/g, '_')}_Due.ics`;
        a.click();
      };

      return (
        <div className="space-y-8 max-w-7xl mx-auto">
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold text-white">Home & Financial Center</h2>
              <p className="text-xs text-slate-400">Track cash, bank, credit card balances, receivables, bills, and household checklists</p>
            </div>

            <button
              onClick={() => { setTempAccounts(accounts); setIsEditAccountsOpen(true); }}
              className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3.5 py-2 rounded-xl font-medium border border-slate-700 flex items-center gap-2"
            >
              <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
              Edit Accounts Balances
            </button>
          </div>

          {/* Accounts Balances Header Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-[#0d131f] border border-slate-800 p-5 rounded-2xl space-y-2 relative">
              <div className="flex items-center justify-between text-slate-400 text-xs font-medium">
                <span className="flex items-center gap-2">
                  <i data-lucide="banknote" className="w-4 h-4 text-emerald-400"></i>
                  Cash Balance
                </span>
              </div>
              <p className="text-2xl font-bold text-emerald-400">AED {accounts.cash?.toLocaleString()}</p>
              <span className="text-[11px] text-slate-500">Physical Cash</span>
            </div>

            <div className="bg-[#0d131f] border border-slate-800 p-5 rounded-2xl space-y-2 relative">
              <div className="flex items-center justify-between text-slate-400 text-xs font-medium">
                <span className="flex items-center gap-2">
                  <i data-lucide="building-2" className="w-4 h-4 text-blue-400"></i>
                  Bank Account
                </span>
              </div>
              <p className="text-2xl font-bold text-blue-400">AED {accounts.bank?.toLocaleString()}</p>
              <span className="text-[11px] text-slate-500">Checking / Savings</span>
            </div>

            <div className="bg-[#0d131f] border border-slate-800 p-5 rounded-2xl space-y-2 relative">
              <div className="flex items-center justify-between text-slate-400 text-xs font-medium">
                <span className="flex items-center gap-2">
                  <i data-lucide="credit-card" className="w-4 h-4 text-purple-400"></i>
                  Credit Card
                </span>
              </div>
              <p className="text-2xl font-bold text-purple-400">AED {accounts.creditCard?.toLocaleString()}</p>
              <span className="text-[11px] text-slate-500">Available Limit</span>
            </div>
          </div>

          {/* Pending Receivables Table */}
          <div className="bg-[#0d131f] border border-slate-800 rounded-2xl p-6 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">

                <i data-lucide="arrow-down-left" className="w-5 h-5 text-emerald-400"></i>

              </div>
              <span className="text-xs text-slate-400">
                Total Pending: <strong className="text-emerald-400">AED {receivables.filter(r => r.status === 'Pending').reduce((s, r) => s + r.amount, 0).toLocaleString()}</strong>
              </span>
            </div>

            <form onSubmit={handleAddReceivable} className="flex flex-wrap gap-2 pt-1">
              <input
                type="text"

                value={newRecSource}
                onChange={(e) => setNewRecSource(e.target.value)}

              <input

            </form>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {['Supermarket', 'Home Supplies', 'Tech & Gear'].map(cat => {
                const items = shoppingItems.filter(s => s.category === cat);
                return (
                  <div key={cat} className="bg-slate-900/70 border border-slate-800 rounded-xl p-4 space-y-2">
                    <h4 className="font-semibold text-slate-300 text-xs uppercase tracking-wider border-b border-slate-800 pb-2">{cat}</h4>
                    <div className="space-y-1">
                      {items.map(item => (
                        <label key={item.id} className="flex items-center gap-2.5 text-xs text-slate-300 cursor-pointer p-1.5 hover:bg-slate-800/50 rounded-lg">
                          <input
                            type="checkbox"
                            checked={item.done}
                            onChange={() => toggleShopItem(item.id)}
                            className="w-3.5 h-3.5 rounded border-slate-700 bg-slate-800 text-brand-600"
                          />
                          <span className={item.done ? 'line-through text-slate-500' : ''}>{item.name}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Modal to Choose Account when receiving money */}
          {pendingReceiveId && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0d131f] border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-5">
                <div className="space-y-1">
                  <h3 className="text-lg font-bold text-white">Select Deposit Account</h3>
                  <p className="text-xs text-slate-400">
                    Which account received this payment? The amount will be added to its balance.
                  </p>
                </div>

                <div className="grid grid-cols-1 gap-2.5">
                  <button
                    onClick={() => confirmReceiveMoney('cash')}
                    className="flex items-center justify-between p-3.5 rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 text-left transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <i data-lucide="banknote" className="w-5 h-5 text-emerald-400"></i>
                      <div>
                        <p className="text-sm font-semibold text-slate-200">Cash</p>
                        <span className="text-xs text-slate-400">Balance: AED {accounts.cash}</span>
                      </div>
                    </div>
                    <span className="text-xs text-emerald-400 font-medium">+ Deposit →</span>
                  </button>

                  <button
                    onClick={() => confirmReceiveMoney('bank')}
                    className="flex items-center justify-between p-3.5 rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 text-left transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <i data-lucide="building-2" className="w-5 h-5 text-blue-400"></i>
                      <div>
                        <p className="text-sm font-semibold text-slate-200">Bank Account</p>
                        <span className="text-xs text-slate-400">Balance: AED {accounts.bank}</span>
                      </div>
                    </div>
                    <span className="text-xs text-emerald-400 font-medium">+ Deposit →</span>
                  </button>

                  <button
                    onClick={() => confirmReceiveMoney('creditCard')}
                    className="flex items-center justify-between p-3.5 rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 text-left transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <i data-lucide="credit-card" className="w-5 h-5 text-purple-400"></i>
                      <div>
                        <p className="text-sm font-semibold text-slate-200">Credit Card</p>
                        <span className="text-xs text-slate-400">Balance: AED {accounts.creditCard}</span>
                      </div>
                    </div>
                    <span className="text-xs text-emerald-400 font-medium">+ Deposit →</span>
                  </button>
                </div>

                <button
                  onClick={() => setPendingReceiveId(null)}
                  className="w-full text-center py-2 text-xs text-slate-400 hover:text-white"
                >
                  Cancel
                </button>
              </div>
            </div>
          )}

          {/* Modal to Choose Payment Account when paying a bill */}
          {pendingPaidBillId && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0d131f] border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-5">
                <div className="space-y-1">
                  <h3 className="text-lg font-bold text-white">Select Payment Account</h3>
                  <p className="text-xs text-slate-400">
                    Which account did you use to pay this bill? The amount will be deducted automatically.
                  </p>
                </div>

                <div className="grid grid-cols-1 gap-2.5">
                  <button
                    onClick={() => confirmPayBill('cash')}
                    className="flex items-center justify-between p-3.5 rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 text-left transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <i data-lucide="banknote" className="w-5 h-5 text-emerald-400"></i>
                      <div>
                        <p className="text-sm font-semibold text-slate-200">Cash</p>
                        <span className="text-xs text-slate-400">Balance: AED {accounts.cash}</span>
                      </div>
                    </div>
                    <span className="text-xs text-brand-400 font-medium">Pay →</span>
                  </button>

                  <button
                    onClick={() => confirmPayBill('bank')}
                    className="flex items-center justify-between p-3.5 rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 text-left transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <i data-lucide="building-2" className="w-5 h-5 text-blue-400"></i>
                      <div>
                        <p className="text-sm font-semibold text-slate-200">Bank Account</p>
                        <span className="text-xs text-slate-400">Balance: AED {accounts.bank}</span>
                      </div>
                    </div>
                    <span className="text-xs text-brand-400 font-medium">Pay →</span>
                  </button>

                  <button
                    onClick={() => confirmPayBill('creditCard')}
                    className="flex items-center justify-between p-3.5 rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 text-left transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <i data-lucide="credit-card" className="w-5 h-5 text-purple-400"></i>
                      <div>
                        <p className="text-sm font-semibold text-slate-200">Credit Card</p>
                        <span className="text-xs text-slate-400">Balance: AED {accounts.creditCard}</span>
                      </div>
                    </div>
                    <span className="text-xs text-brand-400 font-medium">Pay →</span>
                  </button>
                </div>

                <button
                  onClick={() => setPendingPaidBillId(null)}
                  className="w-full text-center py-2 text-xs text-slate-400 hover:text-white"
                >
                  Cancel
                </button>
              </div>
            </div>
          )}

          {/* Modal to Edit Account Balances */}
          {isEditAccountsOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0d131f] border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4">
                <h3 className="text-lg font-bold text-white">Update Account Balances</h3>

                <form onSubmit={handleSaveAccounts} className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Cash Balance (AED)</label>
                    <input
                      type="number"
                      value={tempAccounts.cash}
                      onChange={(e) => setTempAccounts({ ...tempAccounts, cash: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Bank Balance (AED)</label>
                    <input
                      type="number"
                      value={tempAccounts.bank}
                      onChange={(e) => setTempAccounts({ ...tempAccounts, bank: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Credit Card Balance (AED)</label>
                    <input
                      type="number"
                      value={tempAccounts.creditCard}
                      onChange={(e) => setTempAccounts({ ...tempAccounts, creditCard: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsEditAccountsOpen(false)}
                      className="px-4 py-2 rounded-xl text-xs text-slate-400 hover:bg-slate-800"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="bg-brand-600 hover:bg-brand-500 text-white px-4 py-2 rounded-xl text-xs font-medium"
                    >
                      Save Balances
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 5. ERRANDS VIEW
    function ErrandsView({ errands, setErrands }) {
      const [newErrand, setNewErrand] = useState('');
      const [priority, setPriority] = useState('Medium');
      const [dueDate, setDueDate] = useState('');

      const toggleErrand = (id) => {
        setErrands(prev => prev.map(e => e.id === id ? { ...e, done: !e.done } : e));
      };

      const handleAddErrand = (e) => {
        e.preventDefault();
        if (!newErrand.trim()) return;
        setErrands([
          ...errands,
          { id: 'e-' + Date.now(), name: newErrand, priority, dueDate: dueDate || 'Today', done: false }
        ]);
        setNewErrand('');
      };

      const deleteErrand = (id) => {
        setErrands(errands.filter(e => e.id !== id));
      };

      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          <div>
            <h2 className="text-xl font-bold text-white">Errands & Follow-ups</h2>
            <p className="text-xs text-slate-400">Daily quick tasks, administrative follow-ups, and personal items</p>
          </div>

          <form onSubmit={handleAddErrand} className="bg-[#0d131f] border border-slate-800 p-4 rounded-2xl flex flex-wrap gap-2">
            <input
              type="text"
              placeholder="Add new errand or personal task..."
              value={newErrand}
              onChange={(e) => setNewErrand(e.target.value)}
              className="flex-1 min-w-[200px] bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 outline-none focus:border-brand-500"
            />
            <select
              value={priority}
              onChange={(e) => setPriority(e.target.value)}
              className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 outline-none"
            >
              <option value="High">High Priority</option>
              <option value="Medium">Medium Priority</option>
              <option value="Low">Low Priority</option>
            </select>
            <input
              type="date"
              value={dueDate}
              onChange={(e) => setDueDate(e.target.value)}
              className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 outline-none"
            />
            <button type="submit" className="bg-brand-600 hover:bg-brand-500 text-white px-4 py-2 rounded-xl text-sm font-medium">
              Add Errand
            </button>
          </form>

          <div className="space-y-2">
            {errands.map(item => (
              <div key={item.id} className="bg-[#0d131f] border border-slate-800 p-4 rounded-xl flex items-center justify-between gap-3">
                <label className="flex items-center gap-3 flex-1 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={item.done}
                    onChange={() => toggleErrand(item.id)}
                    className="w-4 h-4 rounded border-slate-700 bg-slate-800 text-brand-600"
                  />
                  <span className={`text-sm ${item.done ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                    {item.name}
                  </span>
                </label>

                <div className="flex items-center gap-3">
                  <span className={`text-[10px] px-2.5 py-0.5 rounded-full font-semibold ${
                    item.priority === 'High' ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : 'bg-slate-800 text-slate-400'
                  }`}>
                    {item.priority}
                  </span>
                  <span className="text-xs text-slate-500">{item.dueDate}</span>
                  <button onClick={() => deleteErrand(item.id)} className="text-slate-500 hover:text-rose-400">
                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 6. AI AGENT VIEW
    function AiAgentView({ workTasks, setWorkTasks, bills, setBills, errands, setErrands, settings }) {
      const [messages, setMessages] = useState([
        { role: 'agent', text: "Hello Mahmoud! I am your Life OS Assistant. How can I assist you today? You can ask me for your daily briefing, or tell me to add tasks/bills in plain English or Arabic." }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSend = async (e) => {
        e.preventDefault();
        if (!input.trim() || loading) return;

        const userMsg = input;
        setInput('');
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setLoading(true);

        try {
          const apiKey = settings.geminiApiKey || '';
          if (!apiKey) {
            setTimeout(() => {
              setMessages(prev => [...prev, { 
                role: 'agent', 
                text: `I have processed your request: "${userMsg}". (Note: Add your Gemini API Key in the Notification Dashboard settings for live Gemini 3 Flash execution).` 
              }]);
              setLoading(false);
            }, 1000);
            return;
          }

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `You are Mahmoud's Life OS Assistant. Help him manage tasks, bills, receivables, and schedules efficiently. Current user query: "${userMsg}"`
                }]
              }]
            })
          });

          const data = await response.json();
          const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Response generated successfully.";
          setMessages(prev => [...prev, { role: 'agent', text: aiText }]);
        } catch (err) {
          setMessages(prev => [...prev, { role: 'agent', text: "Error connecting to AI service. Please check your API key." }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto h-[calc(100vh-120px)] flex flex-col bg-[#0d131f] border border-slate-800 rounded-2xl overflow-hidden">
          <div className="p-4 border-b border-slate-800 bg-slate-900/60 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center">
                <i data-lucide="bot" className="w-5 h-5"></i>
              </div>
              <div>
                <h3 className="font-bold text-slate-200 text-sm">Life OS AI Agent</h3>
                <span className="text-[10px] text-slate-400">Powered by Gemini AI</span>
              </div>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
            {messages.map((m, idx) => (
              <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[80%] rounded-2xl p-4 text-sm ${
                  m.role === 'user' ? 'bg-brand-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'
                }`}>
                  {m.text}
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex justify-start">
                <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl text-xs text-slate-400 flex items-center gap-2">
                  <i data-lucide="loader" className="w-4 h-4 animate-spin text-brand-400"></i>
                  AI Agent is thinking...
                </div>
              </div>
            )}
          </div>

          <form onSubmit={handleSend} className="p-3 border-t border-slate-800 bg-slate-900/80 flex gap-2">
            <input
              type="text"
              placeholder="Ask for morning briefing or tell AI to add tasks..."
              value={input}
              onChange={(e) => setInput(e.target.value)}
              className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-brand-500"
            />
            <button type="submit" className="bg-brand-600 hover:bg-brand-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm flex items-center gap-2">
              <i data-lucide="send" className="w-4 h-4"></i>
              Send
            </button>
          </form>
        </div>
      );
    }

    // NOTIFICATION DASHBOARD MODAL
    function NotificationDashboardModal({ settings, setSettings, onClose }) {
      const [email, setEmail] = useState(settings.email);
      const [apiKey, setApiKey] = useState(settings.geminiApiKey || '');
      const [statusMsg, setStatusMsg] = useState('');

      const handleSave = (e) => {
        e.preventDefault();
        setSettings({ ...settings, email, geminiApiKey: apiKey });
        setStatusMsg('Settings saved successfully!');
        setTimeout(() => setStatusMsg(''), 3000);
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-[#0d131f] border border-slate-800 rounded-2xl p-6 max-w-lg w-full space-y-6">
            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
              <h3 className="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="bell" className="w-5 h-5 text-brand-400"></i>
                Notification & Email Dashboard
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSave} className="space-y-4">
              <div>
                <label className="text-xs text-slate-400 block mb-1">Notification Email Address</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-1">Google Gemini API Key (Optional for AI Agent)</label>
                <input
                  type="password"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  placeholder="AIzaSy..."
                  className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-brand-500"
                />
              </div>

              {statusMsg && <p className="text-xs text-emerald-400 font-medium">{statusMsg}</p>}

              <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs text-slate-400 hover:bg-slate-800">
                  Close
                </button>
                <button type="submit" className="bg-brand-600 hover:bg-brand-500 text-white px-5 py-2 rounded-xl text-xs font-medium">
                  Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // QUICK ADD MODAL
    function QuickAddModal({ onClose, setWorkTasks, setBills, setReceivables, setErrands }) {
      const [type, setType] = useState('work');
      const [title, setTitle] = useState('');
      const [amount, setAmount] = useState('');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        if (type === 'work') {
          setWorkTasks(prev => [
            { id: 'w-' + Date.now(), title, client: 'Direct Client', deadline: '2026-10-01', tag: 'Freelance', amount: Number(amount) || 1500, paymentStatus: 'Pending', status: 'To Do' },
            ...prev
          ]);
        } else if (type === 'receivable') {
          setReceivables(prev => [
            { id: 'r-' + Date.now(), source: title, amount: Number(amount) || 1000, dueDate: 'Pending', status: 'Pending', receivedTo: null },
            ...prev
          ]);
        } else if (type === 'bill') {
          setBills(prev => [
            { id: 'b-' + Date.now(), name: title, amount: Number(amount) || 500, dueDay: 15, status: 'Unpaid' },
            ...prev
          ]);
        } else {
          setErrands(prev => [
            { id: 'e-' + Date.now(), name: title, priority: 'High', dueDate: 'Today', done: false },
            ...prev
          ]);
        }
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-[#0d131f] border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4">
            <h3 className="text-lg font-bold text-white">+ Quick Add Item</h3>

            <div className="flex gap-1 p-1 bg-slate-900 rounded-xl border border-slate-800">
              {['work', 'receivable', 'bill', 'errand'].map(t => (
                <button
                  key={t}
                  type="button"
                  onClick={() => setType(t)}
                  className={`flex-1 py-1.5 rounded-lg text-xs font-medium capitalize transition-all ${
                    type === t ? 'bg-brand-600 text-white' : 'text-slate-400'
                  }`}
                >
                  {t}
                </button>
              ))}
            </div>

            <form onSubmit={handleAdd} className="space-y-3">
              <input
                type="text"
                placeholder="Title / Description..."
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none"
              />

              {type !== 'errand' && (
                <input
                  type="number"
                  placeholder="Amount (AED)..."
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none"
                />
              )}

              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs text-slate-400 hover:bg-slate-800">
                  Cancel
                </button>
                <button type="submit" className="bg-brand-600 hover:bg-brand-500 text-white px-5 py-2 rounded-xl text-xs font-medium">
                  Add Item
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
